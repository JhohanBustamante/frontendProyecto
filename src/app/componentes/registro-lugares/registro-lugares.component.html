<app-header></app-header>
<app-home-admin></app-home-admin>

<div class="registro">
    <main>
        <div class="container">
            <table class="table table-dark table-hover">
                <thead>
                    <tr>
                        <th scope="col">Nombre</th>
                        <th scope="col">Correo</th>
                        <th scope="col">Rol</th>
                        <th scope="col">Estado</th>
                    </tr>
                </thead>
                <tbody>

                    <ng-container *ngFor="let item of datos">
                        <tr (click)="cargar(item._id)">
                            <td>{{item.nombre}}</td>
                            <td>{{item.correo}}</td>
                            <td>{{item.rol}}</td>
                            <td>{{item.estado}}</td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
            <div type="button" class="btnNuevo" (click)="agregar()">
                <img src="iconos/mas.png">
            </div>
            <div class="modal fade" id="aniadirModal" tabindex="-1" aria-labelledby="aniadir" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="aniadir">Agregar usuario</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <div class="row">

                                <div class="form-group col-12">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" class="form-control form-control-sm" id="nombre"
                                        [(ngModel)]="nombre">
                                </div>

                                <div class="form-group col-12">
                                    <label for="correo" class="form-label">Correo</label>
                                    <input type="text" class="form-control form-control-sm" id="correo"
                                        [(ngModel)]="correo" [disabled]="idSeleccionado !== ''">
                                </div>

                                <div class="form-group col-12" *ngIf="idSeleccionado == '' ">
                                    <label for="contrasenia" class="form-label"> Contrasena</label>
                                    <input type="password" class="form-control form-control-sm" id="contrasenia"
                                        [(ngModel)]="contrasena">
                                </div>

                                <div class="form-group col-12 col-md-6">
                                    <label for="rol"> Rol</label>
                                    <select class="form-control form-control-sm" id="rol" [(ngModel)]="rol">
                                        <option value="Cliente">Cliente</option>
                                        <option value="Administrador">Administrador</option>
                                    </select>
                                </div>

                                <div class="form-group col-12 col-md-6">
                                    <label for="estado"> Estado</label>
                                    <select class="form-control form-control-sm" id="estado" [(ngModel)]="estado">
                                        <option value="Activo">Activo</option>
                                        <option value="Inactivo">Inactivo</option>
                                    </select>
                                </div>

                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-primary" (click)="guardar()"
                                *ngIf="idSeleccionado == ''">Guardar</button>
                            <button type="button" class="btn btn-danger" (click)="eliminar()"
                                *ngIf="idSeleccionado !== '' ">Eliminar</button>
                            <button type="button" class="btn btn-primary" (click)="actualizar()"
                                *ngIf="idSeleccionado !== '' ">Actualizar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<app-footer></app-footer>
