<app-header></app-header>

<app-home-admin></app-home-admin>

<main>
    <div class="container">
        <div class="row">
            <div class="col-6 col-sm-8">
                <h2 id="tituloIndividual" class="tituloBD">
                    {{ misDatos.titulo }}
                </h2>
            </div>
            <div class="col-6 col-sm-4" id="listaLugares">
                <div class="dropdown">
                    <a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        Lugares
                    </a>
                    <ul class="dropdown-menu">
                        <ng-container *ngFor="let item of datos">
                            <li><a class="dropdown-item" href="/lugares/{{item._id}}">{{item.titulo}}</a></li>
                        </ng-container>
                    </ul>
                </div>
            </div>
        </div>
        <div class="row">
            <img src="http://localhost:3000/imagenes/{{misDatos._id}}.png" class="imagen">

            
        </div>
        <div class="row">
            <div id="lugarTitulo">
                <h4 class="subtituloBD">
                    {{misDatos.subtitulo}}
                </h4>
            </div>
            <div class="col-12 descripcionLugar" id="lugarDescripcion">
                <p class="descripcionBD">
                    {{misDatos.descripcion}}
                </p> <br><br>
                <p>
                    Cualidades:
                </p>
                <ul>
                    <ng-component *ngIf="misDatos.listaUno !=='' ">
                        <li class="listaUnoBD">
                            {{misDatos.listaUno}}
                        </li>
                    </ng-component>
                    <li class="listaDosBD" *ngIf="misDatos.listaDos !=='' ">
                        {{misDatos.listaDos}}

                    </li>
                    <li class="listaTresBD" *ngIf="misDatos.listaTres !=='' ">
                        {{misDatos.listaTres}}

                    </li>
                    <li class="listaCuatroBD" *ngIf="misDatos.listaCuatro !=='' ">
                        {{misDatos.listaCuatro}}

                    </li>
                    <ng-component *ngIf="misDatos.listaCinco !== '' ">
                        <li class="listaCincoBD">
                            {{misDatos.listaCinco}}
                        </li>
                    </ng-component>

                </ul>
            </div>
        </div>
        <div class="row">

        </div>
    </div>
</main>


<app-footer></app-footer>
